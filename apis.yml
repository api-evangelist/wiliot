    url: authentication/wiliot-authentication.yml
- name: Wiliot Edge API
  description: >-
    Manage edge infrastructure - gateways, bridges, verification bridges and
    debug/coverage surveys.
  humanURL: https://developer.wiliot.com/
  baseURL: https://api.wiliot.com/v1
- name: Wiliot Manufacturing API
  description: >-
    Manufacturing operations - pixel ownership changes, reels, tag
    serialization, shipment approval, payload parse/resolve and sensor/tester
    data upload.
