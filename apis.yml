aid: wiliot
name: Wiliot
description: >-
  Wiliot operates an ambient IoT platform built on battery-free "IoT Pixels" -
  postage-stamp-sized Bluetooth sensor tags - and a cloud that turns everyday
  physical items into a continuous, real-time data source for supply-chain
  visibility ("Physical AI"). Wiliot's Cloud APIs expose three surfaces: a
  Platform (traceability) API for pixels, assets, categories, locations, zones
  and events; an Edge API for gateways, bridges and coverage surveys; and a
  Manufacturing API for pixel ownership, reels, serialization and sensor/tester
  data. Access uses an API key (or username/password) exchanged for a JWT bearer
  token, over a versioned REST surface scoped per owner. Official Python SDKs
  (wiliot-api, wiliot-core, and others) plus a React Native SDK are published.
